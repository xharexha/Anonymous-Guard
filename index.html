<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ANONYMOUS AI</title>
  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: #090d16; color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased; overflow-x: hidden;
    }
    #anonymous-app-container {
      width: 100%; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box;
    }
    
    /* LOGO AUF EXAKTE 1-EURO-MÜNZGRÖSSE (85PX) FIXIERT */
    #logo-container {
      display: flex; justify-content: center; align-items: center; width: 100%; cursor: pointer; outline: none; -webkit-tap-highlight-color: transparent;
    }
    #logo-container:active {
      transform: scale(0.95);
    }
    .euro-size-logo {
      width: 85px; height: 85px; display: block;
    }

    /* WORKSPACE - SOFORT ANSPRECHBAR NACH LOGO-KLICK */
    #hidden-workspace {
      display: none; flex-direction: column; width: 100%; max-width: 400px; margin-top: 25px;
    }
    #ad-banner-zone {
      background: #111827; padding: 5px; border-radius: 8px; border: 1px dashed #1e293b;
      display: flex; justify-content: center; min-height: 50px; margin-bottom: 20px;
    }
    .m-btn {
      width: 100%; background: #111827; border: 1px solid #334155; color: #f1f5f9;
      padding: 16px; border-radius: 12px; font-size: 14px; text-align: left; font-weight: bold; cursor: pointer; margin-bottom: 12px; box-sizing: border-box;
    }
    .m-btn:active { background: #1e293b !important; border-color: #00ff66 !important; color: #00ff66 !important; }
    #text-input-container {
      display: flex; flex-direction: column; gap: 10px; margin-top: 5px; width: 100%;
    }
    #raw-text {
      width: 100%; height: 130px; background: #020617; border: 1px solid #00ff66;
      border-radius: 8px; color: #fff; padding: 12px; font-size: 14px; resize: none; box-sizing: border-box;
    }
    #launch-analysis-btn {
      background: linear-gradient(135deg, #00ff66 0%, #00bcff 100%); border: none;
      color: #090d16; padding: 16px; font-weight: bold; border-radius: 10px; cursor: pointer; font-size: 14px; letter-spacing: 1px;
    }
    #result-view {
      display: none; background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 18px; font-size: 14px; line-height: 1.6; margin-top: 20px; white-space: pre-wrap; color: #e2e8f0;
    }
    .action-row-btn { width: 100%; border: none; padding: 16px; font-weight: bold; border-radius: 10px; cursor: pointer; font-size: 14px; margin-top: 10px; }
  </style>
</head>
<body>

<div id="anonymous-app-container">

  <!-- Das korrigierte Anonymous-Logo -->
  <div id="logo-container" onclick="unlockSystem()" role="button" tabindex="0">
    <svg class="euro-size-logo" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="85" fill="none" stroke="#00ff66" stroke-width="3" opacity="0.6"/>
      <path d="M48,125 C37,100 37,65 48,40" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.8"/>
      <path d="M152,125 C163,100 163,65 152,40" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.8"/>
      <path d="M60,165 L140,165 L135,115 L118,95 L100,107 L82,95 L65,115 Z" fill="#ffffff"/>
      <path d="M72,165 L128,165 L124,120 L115,105 L100,115 L85,105 L76,120 Z" fill="#000000"/>
      <path d="M85,105 L100,125 L115,105 L105,105 L100,112 L95,105 Z" fill="#ffffff"/>
      <path d="M97,112 L103,112 L106,140 L100,148 L94,140 Z" fill="#000000"/>
      <text x="100" y="80" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#00ff66" text-anchor="middle">?</text>
    </svg>
  </div>

  <div id="hidden-workspace">
    <!-- Werbebanner gekoppelt an deine A-Ads ID 2457695 -->
    <div id="ad-banner-zone">
      <iframe data-aa='2457695' src='https://a-ads.com' style='width:320px; height:50px; border:0px; padding:0; overflow:hidden; background-color:transparent;'></iframe>
    </div>

    <!-- Fotomediathek -->
    <input type="file" id="cam-trigger" accept="image/*" style="display: none;" onchange="processCapture(this)">
    <button class="m-btn" onclick="document.getElementById('cam-trigger').click()">📷 Open Media Gallery / Upload Image</button>

    <div id="text-input-container">
      <textarea id="raw-text" placeholder="Füg den Text hier ein... / Shkruaj tekstin këtu..."></textarea>
      <button id="launch-analysis-btn" onclick="processRawText()">START REAL-TIME LOCAL ANALYSIS</button>
    </div>

    <div id="result-view">
      <div id="result-content"></div>
      <button class="action-row-btn" onclick="speakResult()" style="background: #00ff66; color: #090d16;">🔊 ANNA: READ OUT / LEXO</button>
      <button class="action-row-btn" onclick="closeAndPurge()" style="background: #ff3366; color: #ffffff;">🔒 PURGE DATA & CLOSE</button>
    </div>
  </div>

</div>

<script>
  let textToRead = ""; let detectedLanguageCode = "de-DE";
  
  function unlockSystem() { 
    document.getElementById("hidden-workspace").style.display = "flex"; 
  }
  
  function processCapture(input) { 
    if(input.files && input.files.length > 0) { 
      executeLocalMatrix("ANONYMOUS PROCESSING ENGINE:\n\n[SUCCESS] Image data captured locally."); 
    } 
  }
  
  function processRawText() {
    let input = document.getElementById("raw-text").value; if(!input.trim()) return;
    let lower = input.toLowerCase(); let verdict = "";
    if(lower.includes("drejtuar") || lower.includes("ipk") || lower.includes("ligj") || lower.includes("policia")) {
      detectedLanguageCode = "sq-AL";
      verdict = "ANALYTIKA ANONYMOUS AI:\n\nTë dhënat u përpunuan në memorien lokale të pajisjes në mënyrë të sigurt.";
    } else {
      detectedLanguageCode = "de-DE";
      verdict = "ANONYMOUS AI ANALYSE:\n\nEingabe wurde erfolgreich lokal in Echtzeit verarbeitet.";
    }
    executeLocalMatrix(verdict);
  }
  
  function executeLocalMatrix(output) { 
    document.getElementById("launch-analysis-btn").innerText = "PROCESSING..."; 
    setTimeout(() => { 
      textToRead = output; 
      document.getElementById("result-content").innerText = output; 
      document.getElementById("result-view").style.display = "block"; 
      document.getElementById("launch-analysis-btn").innerText = "START REAL-TIME LOCAL ANALYSIS"; 
    }, 1000); 
  }
  
  function speakResult() { if (!textToRead) return; window.speechSynthesis.cancel(); let utterance = new SpeechSynthesisUtterance(textToRead); utterance.lang = detectedLanguageCode; utterance.rate = 0.95; window.speechSynthesis.speak(utterance); }
  function closeAndPurge() { window.speechSynthesis.cancel(); textToRead = ""; document.getElementById("result-content").innerText = ""; document.getElementById("raw-text").value = ""; document.getElementById("result-view").style.display = "none"; document.getElementById("hidden-workspace").style.display = "none"; }
</script>
</body>
</html>
